version: "3"

# The same verb means the same thing in every repository.
#
#   build    produce the artifact          (applicable: airlock is a binary)
#   test     run the full test suite       (always)
#   lint     static analysis, non-mutating (always)
#   format   apply formatting, mutating    (always)
#   check    everything CI runs            (always)
#   dev      run locally with hot reload   (not applicable)
#
# dev is deliberately absent. airlock is a batch command line tool with no
# server and no watch loop; `cargo run` is the whole development loop.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Produce the airlock binary
    cmds:
      - cargo build --workspace

  test:
    desc: Run the full test suite
    cmds:
      - cargo test --workspace
      - scripts/test-action.sh

  lint:
    desc: Static analysis and a formatting check, both non-mutating
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings
      - actionlint .github/workflows/*.yml
      - shellcheck scripts/*.sh
      - >-
        ryl check --config-file .ryl.yml .github/workflows/*.yml
        .github/repo-settings.yml docs/examples/*.yml taskfile.yml
      - rumdl check .
      - intentional check

  format:
    desc: Apply formatting
    cmds:
      - cargo fmt --all

  msrv:
    desc: >-
      Build the production targets against the committed lockfile, for the
      minimum supported toolchain
    cmds:
      # Build, not test: the MSRV is a promise to consumers about building
      # airlock, and dev-dependencies (wiremock needs 1.88) are not part of it.
      # The full suite runs on stable in the test job.
      - cargo build --workspace --locked

  ci:install-linters:
    desc: Install the repository linters used by CI
    cmds:
      - sudo apt-get update
      - sudo apt-get install --yes shellcheck
      - go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - cargo install --locked ryl --version 0.21.0
      - cargo install --locked rumdl --version 0.2.40
      - cargo install --locked intentional-cli --version 0.1.6

  audit:summary:
    desc: Append the scheduled audit outcome to the GitHub job summary
    requires:
      vars:
        - GITHUB_STEP_SUMMARY
        - OUTCOME
        - COMPLETE
    cmds:
      - |
        {
          echo "## Airlock audit"
          echo
          echo "- Outcome: \`$OUTCOME\`"
          echo "- Complete: \`$COMPLETE\`"
        } >> "$GITHUB_STEP_SUMMARY"

  lint:commit-msg:
    desc: Validate a conventional commit subject
    silent: true
    cmds:
      # The subject arrives as a shell-quoted argument, so a title containing
      # quotes or metacharacters is data rather than script.
      - sh scripts/check-commit-subject.sh {{.CLI_ARGS}}

  dogfood:
    desc: Audit this repository with the binary it builds
    # Deliberately absent from `check`: it needs AIRLOCK_TOKEN, a credential
    # `task check` has no business requiring on a contributor's machine.
    cmds:
      - cargo run --quiet -p airlock-cli -- audit wyrd-company/airlock --format json

  dogfood:when-provisioned:
    desc: Run the dogfood audit when CI has its read-only credential
    cmds:
      - |
        if [ -n "${AIRLOCK_TOKEN:-}" ]; then
          task dogfood
        else
          echo "AIRLOCK_TOKEN is not provisioned; skipping the dogfood audit."
        fi

  check:
    desc: Everything CI runs that needs no secret — run this before pushing
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: msrv
