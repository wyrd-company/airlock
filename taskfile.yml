version: "3"

# The same verb means the same thing in every repository.
#
#   build    produce the artifact          (applicable: airlock is a binary)
#   test     run the full test suite       (always)
#   lint     static analysis, non-mutating (always)
#   format   apply formatting, mutating    (always)
#   check    everything CI runs            (always)
#   dev      run locally with hot reload   (not applicable)
#
# dev is deliberately absent. airlock is a batch command line tool with no
# server and no watch loop; `cargo run` is the whole development loop.

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Produce the airlock binary
    cmds:
      - cargo build --workspace

  test:
    desc: Run the full test suite
    cmds:
      - cargo test --workspace

  lint:
    desc: Static analysis and a formatting check, both non-mutating
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets -- -D warnings
      # The core and the module as the WebAssembly build compiles them.
      - >-
        cargo clippy -p airlock-core -p airlock-wasm --no-default-features
        --target wasm32-unknown-unknown -- -D warnings
      - actionlint .github/workflows/*.yml
      - shellcheck scripts/*.sh
      - >-
        ryl check --config-file .ryl.yml .github/workflows/*.yml
        .github/airlock.yml docs taskfile.yml action.yml
      - rumdl check .
      - intentional check

  format:
    desc: Apply formatting
    cmds:
      - cargo fmt --all

  msrv:
    desc: >-
      Build the production targets against the committed lockfile, for the
      minimum supported toolchain
    cmds:
      # Build, not test: the MSRV is a promise to consumers about building
      # airlock, and dev-dependencies (wiremock needs 1.88) are not part of it.
      # The full suite runs on stable in the test job.
      - cargo build --workspace --locked

  wasm:install:
    desc: >-
      Install the wasm32 target and the wasm-bindgen command line that
      Cargo.lock locks
    cmds:
      - rustup target add wasm32-unknown-unknown
      - >-
        cargo install --locked wasm-bindgen-cli --version
        "$(sed -n '/^name = "wasm-bindgen"$/{n;s/^version = "\(.*\)"$/\1/p;}' Cargo.lock)"

  wasm:build:
    desc: Build the WebAssembly module and its bindings into target/wasm-pkg
    cmds:
      - scripts/build-wasm.sh

  wasm:size:
    desc: Fail when the module is over the size budget docs/wasm.md states
    cmds:
      - scripts/check-wasm-size.sh

  wasm:test:
    desc: >-
      Run the module's tests under Node: central sign-in against fakes, the
      host's clock, and parity with the native build
    cmds:
      - scripts/test-wasm.sh

  wasm:
    desc: Everything CI runs for the WebAssembly module
    cmds:
      - task: wasm:build
      - task: wasm:size
      - task: wasm:test

  action:install:
    desc: Install the action's locked JavaScript dependencies
    cmds:
      - pnpm --dir action install --frozen-lockfile

  action:build:
    desc: >-
      Build the action's dist/: the WebAssembly module and the bundle that
      loads it. Commit the result
    cmds:
      - scripts/build-action.sh

  action:check-dist:
    desc: Rebuild dist/ and fail on any difference from the committed copy
    cmds:
      - scripts/check-action-dist.sh

  action:test:
    desc: >-
      Run the action end to end, dist/index.mjs against a fake GitHub and a
      fake artifact service
    cmds:
      - pnpm --dir action test

  action:assert-forged-refused:
    desc: >-
      In CI, after the action ran on a forged run token: fail unless it was
      refused as another installation token and uploaded under a per-job name
    requires:
      vars:
        - OUTCOME
        - FINDINGS
        - ARTIFACT
    cmds:
      - test "$OUTCOME" = incomplete
      - grep -q foreign_installation_token "$FINDINGS"
      - echo "$ARTIFACT" | grep -Eq '^airlock-findings-[0-9]+$'
      - echo "refused as foreign_installation_token; uploaded as $ARTIFACT"

  action:
    desc: Everything CI runs for the action
    cmds:
      - task: action:check-dist
      - task: action:test

  ci:install-linters:
    desc: Install the repository linters used by CI
    cmds:
      - sudo apt-get update
      - sudo apt-get install --yes shellcheck
      - go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - cargo install --locked ryl --version 0.21.0
      - cargo install --locked rumdl --version 0.2.40
      - cargo install --locked intentional-cli --version 0.1.6

  audit:summary:
    desc: Append the scheduled audit outcome to the GitHub job summary
    requires:
      vars:
        - GITHUB_STEP_SUMMARY
        - OUTCOME
        - COMPLETE
    cmds:
      - |
        {
          echo "## Airlock audit"
          echo
          echo "- Outcome: \`$OUTCOME\`"
          echo "- Complete: \`$COMPLETE\`"
        } >> "$GITHUB_STEP_SUMMARY"

  lint:commit-msg:
    desc: Validate a conventional commit subject
    silent: true
    cmds:
      # The subject arrives as a shell-quoted argument, so a title containing
      # quotes or metacharacters is data rather than script.
      - sh scripts/check-commit-subject.sh {{.CLI_ARGS}}

  dogfood:
    desc: Audit this repository with the binary it builds
    # Deliberately absent from `check`: it needs a read-only credential
    # (`airlock auth login`, or AIRLOCK_TOKEN), which `task check` has no
    # business requiring on a contributor's machine.
    cmds:
      - cargo run --quiet -p airlock-cli -- audit wyrd-company/airlock --format json

  dogfood:ci:
    desc: >-
      Audit the running repository in repository mode with the run's own
      token, which AIRLOCK_RUN_TOKEN holds; runs only inside GitHub Actions
    requires:
      vars:
        - GITHUB_REPOSITORY
        - AIRLOCK_RUN_TOKEN
    cmds:
      # The token goes in on standard input and stays in AIRLOCK_RUN_TOKEN,
      # which Airlock compares it with before admitting it.
      - >-
        printenv AIRLOCK_RUN_TOKEN | cargo run --quiet -p airlock-cli --
        audit "$GITHUB_REPOSITORY" --mode repository --format json --token-stdin

  check:
    desc: Everything CI runs that needs no secret — run this before pushing
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: msrv
      - task: wasm
      - task: action
