[package]
name = "airlock-cli"
description = "Command line front end for airlock, the repository release-readiness audit tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
airlock-core.workspace = true
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
qrcode.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
zeroize.workspace = true

[features]
# The write path binds to Airlock Test rather than Airlock Admin. Off by
# default, so the shipped binary contains no code and no string that could
# accept the test identity.
test-identity = []

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
base64.workspace = true
predicates.workspace = true
tempfile.workspace = true
wiremock.workspace = true
