[package]
name = "airlock-core"
description = "Repository release-readiness checks, policy resolution, and findings for the airlock command line tool."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[features]
default = ["native"]
# The native transport (reqwest and tokio's timer), local Git and working-tree
# reads. A WebAssembly build turns it off and supplies its own transport.
native = ["dep:gix", "dep:ignore", "dep:reqwest", "dep:tokio"]

[dependencies]
globset.workspace = true
base64.workspace = true
hex.workspace = true
jsonschema.workspace = true
percent-encoding.workspace = true
reqwest = { workspace = true, optional = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
sha2.workspace = true
gix = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
toml.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
tokio.workspace = true
wiremock.workspace = true
