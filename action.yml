name: Airlock audit
description: >-
  Audit this repository in repository mode, on the run's own token, which
  Airlock proves is read-only

inputs:
  mode:
    description: >-
      repository, the only mode the action runs. central is refused: the
      Airlock Worker's scheduled central audit replaces it
    required: false
    default: repository
  token:
    description: >-
      The run's own token, as github.token. Airlock accepts it only inside
      Actions, for the run's repository, when every permission the job
      declares is read. Without it, AIRLOCK_TOKEN is read instead
    required: false
    default: ""
  run-token:
    description: >-
      Leave unset. The run's own token, which an installation token in token
      must equal. It is compared only, and never sent
    required: false
    default: ${{ github.token }}
  repository:
    description: >-
      Repository to audit as owner/repo; defaults to the current repository,
      the only one the run's own token audits
    required: false
    default: ""
  policy:
    description: >-
      Policy source as owner/repo:path[@ref]; defaults to the owner's
      .github/airlock.yml. A local path is refused
    required: false
    default: ""
  ref:
    description: Commit, branch, or tag to audit; defaults to the default branch
    required: false
    default: ""
  format:
    description: Findings format, either json or text
    required: false
    default: json
  fail-on-incomplete:
    description: >-
      Whether an incomplete audit fails the step; false lets it succeed,
      including when the token is missing or refused
    required: false
    default: "true"

outputs:
  outcome:
    description: >-
      conformant, nonconformant (blocking gaps), or incomplete (a run
      error); waived, routed, unbuilt, and out-of-scope do not affect it
  complete:
    description: Whether the audit completed without a run error
  findings-location:
    description: >-
      Absolute path to the findings document on the runner; the same document
      is uploaded as the airlock-findings artifact

runs:
  using: node24
  main: dist/index.mjs
