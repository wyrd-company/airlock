[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/wyrd-company/airlock"

[workspace.dependencies]
airlock-core = { path = "crates/core", version = "0.1.0" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
