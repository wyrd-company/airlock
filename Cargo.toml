[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/wyrd-company/airlock"

[workspace.dependencies]
airlock-core = { path = "crates/core", version = "0.0.0" }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
percent-encoding = "2.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_norway is the maintained fork of the deprecated serde_yaml.
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
toml = "0.8"

assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
