[workspace]
members = ["crates/core", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/wyrd-company/airlock"

[workspace.dependencies]
airlock-core = { path = "crates/core", version = "0.0.0" }
anyhow = "1.0"
base64 = "0.22"
# gix reads local git facts (HEAD, dirtiness, remotes) as a library; the
# binary never shells out to git.
gix = { version = "0.73", default-features = false, features = ["status", "revision"] }
# ignore walks a working tree with gitignore semantics, without git.
ignore = "0.4"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
libc = "0.2"
percent-encoding = "2.3"
# qrcode encodes the sign-in address as a scan code. Pure Rust, no default
# features, and no image or svg back end: the interface draws the modules
# itself so it can paint its own light field and quiet zone.
qrcode = { version = "0.14", default-features = false }
# ratatui draws the terminal interface; crossterm is its terminal backend and
# the source of key events. Both are pure Rust with no C dependency.
ratatui = "0.30"
crossterm = "0.29"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# serde_norway is the maintained fork of the deprecated serde_yaml.
serde_norway = "0.9"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "0.8"
# zeroize overwrites the write credential rather than only dropping it.
zeroize = "1"

assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3"
wiremock = "0.6"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
