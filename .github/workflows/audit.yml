name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  audit:
    name: Audit this repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - name: Run Airlock
        id: airlock
        uses: ./
        env:
          AIRLOCK_TOKEN: ${{ secrets.AIRLOCK_TOKEN }}
        with:
          format: json
      - name: Attach findings
        if: always() && env.AIRLOCK_FINDINGS != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: airlock-findings
          path: ${{ env.AIRLOCK_FINDINGS }}
          if-no-files-found: error
      - name: Summarize outcome
        if: always() && env.AIRLOCK_OUTCOME != ''
        env:
          OUTCOME: ${{ env.AIRLOCK_OUTCOME }}
          COMPLETE: ${{ env.AIRLOCK_COMPLETE }}
        run: task audit:summary
