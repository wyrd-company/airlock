name: Audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: audit
  cancel-in-progress: false

jobs:
  # Repository mode on the run's own token, through the action at the root
  # of this repository, which runs the WebAssembly engine from dist/. Airlock
  # reads this job's permissions from this file at GITHUB_WORKFLOW_SHA and
  # accepts the token only because every one of them is read. No secret is
  # read, and no step installs Rust. The action uploads the report as the
  # airlock-findings-<job.check_run_id> artifact itself.
  audit:
    name: Audit this repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2
      - name: Run Airlock
        id: airlock
        uses: ./
        with:
          mode: repository
          token: ${{ github.token }}
          format: json
      - name: Summarize outcome
        if: always() && env.AIRLOCK_OUTCOME != ''
        env:
          OUTCOME: ${{ env.AIRLOCK_OUTCOME }}
          COMPLETE: ${{ env.AIRLOCK_COMPLETE }}
        run: task audit:summary
