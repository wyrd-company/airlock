name: CI

# pull_request, never pull_request_target. pull_request_target runs fork code
# with secrets and write access — the most exploited GitHub Actions vulnerability.
on:
  pull_request:
  push:
    branches:
      - main

# Default deny. Elevate per job, to the minimum that job needs.
permissions: {}

# Stop a contributor's rapid pushes from saturating the runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task build

  # rust-version in Cargo.toml is a promise. This job is what keeps it true:
  # the toolchain is pinned to the declared minimum and the lockfile is not
  # allowed to move, so a dependency that quietly needs a newer compiler fails
  # here rather than on a contributor's machine.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.86.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task msrv

  # Squash merge means the pull request title becomes the commit on main.
  # The title is load-bearing history, so it carries a required check.
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: task lint:commit-msg -- "$PR_TITLE"

  # Airlock audits airlock. The job is present before the credential is: the
  # audit step is skipped until an operator provisions the AIRLOCK_TOKEN
  # secret, so the workflow is honest about what it is and is not checking
  # rather than failing every run until then.
  #
  # AIRLOCK_TOKEN is read-only by construction — airlock refuses any token it
  # cannot prove carries no write permission — so it is the one secret this
  # workflow can hold without widening its blast radius.
  dogfood:
    name: Audit this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AIRLOCK_TOKEN: ${{ secrets.AIRLOCK_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - if: env.AIRLOCK_TOKEN != ''
        run: task dogfood

# Jobs are decomposed so a failure is legible on the pull request, and every job
# invokes a task rather than a raw command so `task check` locally and CI cannot
# drift apart. The dogfood job is the one exception to `task check` covering
# everything CI runs: it needs a credential, and so does the pull request title
# job need a pull request.
