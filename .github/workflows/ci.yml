name: CI

# pull_request, never pull_request_target. pull_request_target runs fork code
# with secrets and write access — the most exploited GitHub Actions vulnerability.
on:
  pull_request:
  push:
    branches:
      - main

# Default deny. Elevate per job, to the minimum that job needs.
permissions: {}

# Stop a contributor's rapid pushes from saturating the runners.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # intentional check reads release tags to verify the baseline.
          fetch-tags: true
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - name: Install repository linters
        run: task ci:install-linters
      - run: task lint

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task test

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task build

  # The engine as the WebAssembly module the Worker and the JavaScript
  # action load: built at the size-optimised profile, held to the budget
  # docs/wasm.md states, and tested under Node, including parity with the
  # native build on recorded responses.
  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task wasm:install
      - run: task wasm

  # The action runs the committed dist/. This job rebuilds it from the source,
  # with the toolchain scripts/build-action.sh names, fails on any difference
  # from the committed copy, then runs the action end to end.
  action:
    name: Action
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: action/package.json
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task wasm:install
      - run: task action:install
      - run: task action

  # The run's own token reaches the engine through the action step's own env,
  # which nothing the caller sets may override. Here the caller tries: a
  # synthetic installation token of another App is the token input and is
  # set as AIRLOCK_RUN_TOKEN at job and step level. The action must refuse it
  # as an installation token other than the run's own, before any request.
  # Two matrix legs also show each job uploads under its own artifact name.
  action-forged-run-token:
    name: "Action: a forged run token is refused"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        leg: [one, two]
    env:
      AIRLOCK_RUN_TOKEN: ghs_999999_eyJhbGciOiJub25lIn0.eyJmb3JnZWQiOjF9.Zm9yZ2Vk-PLACEHOLDER
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - id: forged
        uses: ./
        env:
          AIRLOCK_RUN_TOKEN: ghs_999999_eyJhbGciOiJub25lIn0.eyJmb3JnZWQiOjF9.Zm9yZ2Vk-PLACEHOLDER
        with:
          mode: repository
          token: ghs_999999_eyJhbGciOiJub25lIn0.eyJmb3JnZWQiOjF9.Zm9yZ2Vk-PLACEHOLDER
          fail-on-incomplete: "false"
      - env:
          OUTCOME: ${{ steps.forged.outputs.outcome }}
          FINDINGS: ${{ steps.forged.outputs.findings-location }}
          ARTIFACT: ${{ steps.forged.outputs.artifact }}
        run: task action:assert-forged-refused

  # rust-version in Cargo.toml is a promise. This job is what keeps it true:
  # the toolchain is pinned to the declared minimum and the lockfile is not
  # allowed to move, so a dependency that quietly needs a newer compiler fails
  # here rather than on a contributor's machine.
  msrv:
    name: Minimum supported Rust
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - run: task msrv

  # Squash merge means the pull request title becomes the commit on main.
  # The title is load-bearing history, so it carries a required check.
  pr-title:
    name: Pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: task lint:commit-msg -- "$PR_TITLE"

  # Airlock audits airlock, in repository mode on the run's own token. The
  # job declares only `contents: read`, which is how Airlock enumerates that
  # token's grant: it reads these permissions from this file at
  # GITHUB_WORKFLOW_SHA and refuses the token if any is not read. The
  # workflow reads no secret.
  dogfood:
    name: Audit this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2
      - name: Run dogfood audit
        env:
          AIRLOCK_RUN_TOKEN: ${{ github.token }}
        run: task dogfood:ci

# Jobs are decomposed so a failure is legible on the pull request, and every job
# invokes a task rather than a raw command so `task check` locally and CI cannot
# drift apart. The dogfood task needs a credential, and the pull request title
# task needs a pull request.
