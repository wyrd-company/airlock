# Declared repository metadata. Reconciled to GitHub by
# .github/workflows/reconcile-settings.yml on push to the default branch.
#
# This file is the source of truth. Changing settings in the GitHub UI is
# not a change — the next reconcile reverts it.
#
# There is deliberately no `visibility` field. Publishing a repository is an
# unrecoverable act and stays a manual decision.

description: Audits a GitHub repository against a declared release-readiness policy and reports what would block a release.

# Three to eight. At least one artifact-type and one ecosystem term.
# The vocabulary is wyrd-company/.github:airlock/topics.yml, which the org
# policy pins as reference data; docs/examples/wyrd-topics.yml is the copy
# this repository ships.
topics:
  - cli
  - rust
  - github
  - release-automation
  - devops

merge:
  squash: true
  rebase: true
  merge_commit: false
  delete_branch_on_merge: true

features:
  wiki: false
  projects: false
  discussions: false
