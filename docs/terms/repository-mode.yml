$schema: https://refinery.systems/ontology/term
title: Repository mode
description: >-
  The Airlock action's audit of the one repository running it, and the only mode the action runs,
  with the run's own GITHUB_TOKEN given as its token input. GitHub lists no installation token's
  permissions, so Airlock enumerates this token's grant from the running job's declared
  permissions. It reads them from the workflow file at GITHUB_WORKFLOW_SHA, and accepts the token
  only inside Actions, for the run's repository, when every declared permission is read. The token
  must equal the run's own token, which the action's own step sets to github.token, must be in the
  GitHub Actions app's form ghs_15368_<JWT>, and GitHub's answer to GET /installation/repositories
  must be the run's repository alone, so no other App's token, and no token of another repository,
  is judged by permissions that are not its own. Another GITHUB_TOKEN of the same repository, and
  code the caller runs in the job, are outside that guarantee. Every other surface refuses an
  installation token.
