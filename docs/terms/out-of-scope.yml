$schema: https://refinery.systems/ontology/term
title: Out of scope
description: >-
  The outcome when an evaluation reaches a declared boundary because the repository has no
  release units. The rule is listed in out-of-scope beside waived, routed and unbuilt rules, with
  its reason. Out-of-scope is neither Met nor Gap and leaves the exit code unchanged. A malformed
  or unreadable release-unit declaration remains a run error. Classification and observed
  maturity determine which rules govern a repository.
