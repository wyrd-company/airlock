$schema: https://refinery.systems/ontology/term
title: Classification
description: >-
  The declared audience, family and category of a repository, held in organization-owned GitHub
  custom properties. Compiled standards use this input to determine which repositories they
  govern. Classification is not an audit finding and cannot be changed by the repository's own
  configuration to evade a standard. It replaces capability and apply selectors. The old
  remediation Classification means fix information, not repository classification.
relationships:
  related-to:
    - audience
    - family
    - category
    - maturity
