$schema: https://refinery.systems/ontology/term
title: Classification
description: >-
  The declared audience, family and category of a repository, held in organization-owned
  GitHub custom properties. Compiled rules use this input to determine which repositories
  they govern. Classification is not an audit finding and cannot be changed by the
  repository's own configuration to evade a rule. Information about a rule's available fix
  is distinct from repository classification.
