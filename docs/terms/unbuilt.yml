$schema: https://refinery.systems/ontology/term
title: Unbuilt
description: >-
  An evaluation that reaches a declared part of a compiled check that Airlock has not built.
  The standard remains registered and is listed beside waived and routed standards with its
  reason. Unbuilt is neither Met nor Gap and leaves the exit code unchanged. Other branches
  of the same check can decide Met or Gap from observable evidence. An agent assessment
  cannot replace the missing compiled check.
