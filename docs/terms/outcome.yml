$schema: https://refinery.systems/ontology/term
title: Outcome
description: >-
  The result for one rule: Met, Gap, waived, routed, unbuilt or out-of-scope. Met and Gap are
  evaluated outcomes. Effective severity none yields waived before evaluation; the check never
  decides waived. Routed, unbuilt and out-of-scope record declared gates or boundaries without
  claiming the rule is met. Advisory agent evidence does not change an outcome. Overall process
  exit status is distinct: 0 means no accepted blocking gaps, 1 means accepted blocking gaps
  remain, and 2 means Airlock could not do its job.
