$schema: https://intentional.foo/schemas/config.yml
contract: contract-2
settings:
  internal-dependency-bump: patch
release-units:
  airlock:
    path: .
    projections:
      - adapter: toml
        file: Cargo.toml
        pointer: /workspace/package/version
        mode: committed
      - adapter: toml
        file: Cargo.toml
        pointer: /workspace/dependencies/airlock-core/version
        mode: committed
    tags:
      primary:
        role: primary
        template: "{version}"
